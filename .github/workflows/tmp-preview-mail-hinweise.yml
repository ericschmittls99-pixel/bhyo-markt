# TEMPORAER (vor dem Merge von #219 loeschen): Mail-Hinweise fuer die
# Screenshots auf der Preview anlegen. Push-Trigger nur auf dem PR-Branch,
# nur das Preview-Secret (wie seed-preview.yml).
name: tmp Preview Mail-Hinweise
on:
  push:
    branches: [ap29-umschalten-vorbereiten]
jobs:
  anlegen:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db exec tsx src/log-maske.ts
      - name: Mail-Hinweise anlegen (Preview)
        env:
          SEED_DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web exec tsx scripts/tmp-preview-mail-hinweise.ts
