name: TMP Restore-Probe Preview (nach Migration 0023)

# TEMPORAER — vor dem Merge loeschen. Beweis fuer den Fix VOR Production:
# pg_dump der migrierten Preview, Restore in eine frische, leere Datenbank
# auf dem Scratch-Branch (Secret RESTORE_DATABASE_URL, Environment
# production-lesend), Funktion und Zeilen zaehlen. Loescht nichts.
on:
  push:
    branches: [fix-qualitaetsstufe-search-path]

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production-lesend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL-18-Client installieren
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Preview-Stand pruefen (0023 muss angewendet sein)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -At -c "select count(*) from drizzle.__drizzle_migrations" | tee stand.txt
          psql "$DATABASE_URL" -At -c "select array_to_string(proconfig,' ') from pg_proc where proname='qualitaetsstufe'" | tee config.txt
          grep -q "search_path=public" config.txt || { echo "::error::0023 ist auf der Preview noch nicht angewendet — Probe abgebrochen (erst PR-Deploy abwarten, dann leeren Commit pushen)."; exit 1; }
      - name: Preview dumpen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pg_dump --format=custom --no-owner --no-privileges --dbname "$DATABASE_URL" --file preview.dump && ls -lh preview.dump
      - name: Frische Zieldatenbank + Restore + Nachweis
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          host=$(node -e 'console.log(new URL(process.env.RESTORE_DATABASE_URL).hostname)')
          case "$host" in ep-purple-glade-*|ep-rough-term-*) echo "::error::falsches Ziel $host"; exit 1;; esac
          DBNAME="probe_${GITHUB_RUN_ID}"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$DBNAME\";"
          ZIEL=$(node -e 'const u=new URL(process.env.RESTORE_DATABASE_URL); u.pathname="/"+process.argv[1]; console.log(u.toString())' "$DBNAME")
          echo "::add-mask::$ZIEL"
          pg_restore --dbname "$ZIEL" --no-owner --no-privileges preview.dump
          echo "RESTORE_OK"
          psql "$ZIEL" -At -c "select 'belege='||count(*) from beleg" 
          psql "$ZIEL" -At -c "select 'stufe_vertrag_mit_datei='||qualitaetsstufe('vertrag','x',null)::text"
          psql "$ZIEL" -At -c "select 'tabellen='||count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'"
