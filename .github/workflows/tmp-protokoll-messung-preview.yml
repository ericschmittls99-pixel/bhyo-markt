# TEMPORAER (AP2.2 PR a, Schritt 0): Protokoll-Messung gegen die Preview-DB,
# nur SELECT. Wird vor dem Merge geloescht.
name: tmp Protokoll-Messung Preview
on:
  push:
    branches: [ap22-protokoll]
jobs:
  messen:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Protokoll-Messung Preview (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db protokoll-messung
