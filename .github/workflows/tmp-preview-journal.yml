# TEMPORAER (AP2.2 PR c Nachweis): Migrations-Journal der Preview lesen —
# 0028 muss genau einmal gefuehrt sein. Nur SELECT. Wird vor dem Merge geloescht.
name: tmp Preview-Journal
on:
  push:
    branches: [e45-verfuegbarkeit-filter]
jobs:
  journal:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Journal der Preview (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        working-directory: packages/db
        run: pnpm exec tsx src/tmp-journal-lesen.ts
