name: Leseweg Production (nur lesen)

# Leseweg nach Production (Entscheidung Eric 24.09.2026, Haertung 30.09.2026,
# siehe docs/betrieb.md): Eine zweite Zugangsberechtigung, die nichts als
# SELECT kann (Rolle bhyo_leser), im Environment `production-lesend`. Seit der
# Haertung vom 30.09.2026 erlaubt auch dieses Environment nur `main` (custom
# branch policy; Rot-Nachweis: Dispatch von einem Wegwerf-Branch ohne Runner
# abgewiesen, Lauf 36825384694). Folge: Eine neue Messung wird erst gemergt
# (nur lesend, z. B. protokoll-messung), dann von main gestartet. Der Lauf
# belegt selbst, dass er nichts veraendern kann (Schreibversuch muss scheitern).
#
# Schreibender Zugriff auf Production bleibt ausschliesslich ueber `main`:
# Environment `production` plus die ziel-wache in migrate-production.yml.
on:
  workflow_dispatch:

jobs:
  lesen:
    runs-on: ubuntu-24.04
    # Keine Branch-Wache im Workflow: die Branch-Policy des Environments (nur main) wacht.
    environment: production-lesend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Zielnachweis + Schreibversuch (muss scheitern)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db lese-diagnose
      # E33/E34: Abweichungsliste der Qualitaetsstufen (vor 0021: was sich
      # aendern wird; danach: Zielnachweis mit WECHSEL 0). Nur SELECT.
      - name: Abweichungsliste Belege (E34, nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db beleg-abweichung
      # AP2.2 PR a: Messung des Protokolls (Zeilen, Textmuster, E-Mail-Join;
      # nach 0026 Arten und benutzer_id). Nur SELECT.
      - name: Protokoll-Messung (AP2.2, nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db protokoll-messung
