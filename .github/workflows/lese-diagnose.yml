name: Leseweg Production (nur lesen)

# Entscheidung Eric (24.09.2026), Variante b: Zielnachweis und
# Abweichungslisten muessen VOR einem Merge laufen, also von einem Branch,
# der nicht `main` ist. Das Environment `production` laesst das nicht zu —
# seine Branch-Policy erlaubt nur `main`, auch fuer rein lesende Jobs
# (belegt: Lauf 35994847637, Runner null, 0 Schritte, kein Log).
#
# Statt den schreibenden Zugang aufzuweichen, gibt es eine zweite
# Zugangsberechtigung, die nichts als SELECT kann. Ihr Environment
# `production-lesend` hat bewusst KEINE Branch-Beschraenkung. Der Vorbehalt
# gegen ungeprueften Branch-Code faellt damit weg: Dieser Code kann nichts
# veraendern — und genau das prueft der Lauf selbst, statt es zu behaupten.
#
# Schreibender Zugriff auf Production bleibt ausschliesslich ueber `main`:
# Environment `production` plus die ziel-wache in migrate-production.yml.
on:
  workflow_dispatch:

jobs:
  lesen:
    runs-on: ubuntu-24.04
    # KEINE Branch-Wache hier — dieser Workflow SOLL von jedem Branch laufen.
    environment: production-lesend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Zielnachweis + Schreibversuch (muss scheitern)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db lese-diagnose
      # E33/E34: Abweichungsliste der Qualitaetsstufen (vor 0021: was sich
      # aendern wird; danach: Zielnachweis mit WECHSEL 0). Nur SELECT.
      - name: Abweichungsliste Belege (E34, nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db beleg-abweichung
      # AP2.2 PR a: Messung des Protokolls (Zeilen, Textmuster, E-Mail-Join;
      # nach 0026 Arten und benutzer_id). Nur SELECT.
      - name: Protokoll-Messung (AP2.2, nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db protokoll-messung
