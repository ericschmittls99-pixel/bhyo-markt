name: Migrate Production

# E21 (22.09.2026): Der EINZIGE Weg, Migrationen auf die Produktions-DB zu
# bringen. Manuelles Ausloesen + woertliche Bestaetigung = die ausdrueckliche
# Freigabe aus der Leitplanke "Produktion braucht Freigabe" (Required
# Reviewers stehen im Free-Plan fuer private Repos nicht zur Verfuegung).
# Vergessen wird nicht hier verhindert, sondern im Deploy-Workflow: dessen
# schema-gate blockiert jeden Code-Deploy, solange die DB hinter dem Journal
# zurueckliegt, und verweist auf diesen Workflow.
on:
  workflow_dispatch:
    inputs:
      bestaetigung:
        description: 'Zur Freigabe woertlich "production" eintippen'
        required: true

# Nie zwei Produktions-Migrationen gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  # Ref-Wache (24.09.2026). Anders als im Deploy war hier KEINE Luecke offen:
  # Der migrate-Job haengt am Environment "production", dessen
  # Deployment-Branch-Policy nur "main" zulaesst — ein Dispatch von einem
  # anderen Branch wird von GitHub abgewiesen, bevor der Job startet (belegt:
  # Lauf 35989633127, kein Runner, null Schritte, kein Log). Genau das ist das
  # Problem: Der Abbruch ist wortlos, und der Schutz lebt in einer
  # Repo-Einstellung ausserhalb der Versionierung — wer sie aendert, verliert
  # ihn unbemerkt. Diese Wache laeuft OHNE Environment, also vor der Sperre,
  # und macht den Grund im Log sichtbar. Sie ersetzt die Policy nicht, sie
  # erklaert sie und haelt sie im Repo fest.
  ziel-wache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Migrationsziel gegen den Ref pruefen
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=MIGRATION NUR VON MAIN::Dieser Lauf (ref=$REF) wuerde die Migrationen dieses Branches auf die Produktions-DB anwenden. Abgebrochen — Migrationen laufen ausschliesslich von refs/heads/main, also erst nach dem Merge."
            exit 1
          fi
          echo "ZIELWACHE ref=$REF -> Migration auf Production zulaessig"

  migrate:
    needs: [ziel-wache]
    runs-on: ubuntu-24.04
    # Environment "production" traegt das Secret DATABASE_URL_PRODUCTION und
    # ist auf den Branch main beschraenkt.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Bestaetigung pruefen
        if: inputs.bestaetigung != 'production'
        run: |
          echo '::error::Abbruch: Das Eingabefeld "bestaetigung" muss woertlich "production" lauten.'
          exit 1

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      # E73 (08.10.2026): Logs eines oeffentlichen Repos sind oeffentlich — Host und
      # Datenbanknutzer der Verbindungs-URL werden maskiert, bevor ein Skript sie nennt.
      # packages/db/src/log-maske.ts: per Muster, nie werfend, kein Fehlerpfad gibt Eingaben aus (Test log-maske.test.ts).
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db exec tsx src/log-maske.ts

      # Host-Pruefung VOR der Migration: Am 22.09.2026 lief eine manuelle
      # Migration gegen einen Neon-Snapshot-Branch statt gegen Production,
      # weil Neon nach dem Anlegen eines Branches dessen URL anzeigt —
      # Production blieb zurueck, /register brach. Der Host muss deshalb der
      # dokumentierte Production-Endpoint sein (Endpoint-Tabelle im Handoff
      # docs/ap1j-handoff-verfuegbarkeit-vergabe.md, Abschnitt E21).
      - name: Host pruefen (nur ep-purple-glade = Production)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          host=$(node -e 'console.log(new URL(process.env.DATABASE_URL).hostname)')
          case "$host" in
            ep-purple-glade-b2tra1g7*)
              echo "Production-Endpoint bestaetigt: $host" ;;
            *)
              echo "::error::DATABASE_URL_PRODUCTION zeigt auf '$host' — erwartet wird ep-purple-glade-b2tra1g7.*. Abbruch, es wurde nichts migriert."
              exit 1 ;;
          esac

      # Freigabe-Bedingung 0014 (Eric, 23.09.2026): unmittelbar vor dem DROP
      # muessen die stillgelegten Stufenspalten leer sein, sonst Abbruch ohne
      # DROP; Zielnachweis (Host + Kontrollzaehlung) im selben Log. Der Step
      # ist defensiv (entfaellt, wenn die Spalten schon weg sind) und kann
      # deshalb stehen bleiben.
      - name: Vor-DROP-Waechter + Zielnachweis (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db pre-drop-check

      # F0b PR D (0017): Archiv-Waechter — sichert befuellte E7-Altfelder als
      # Workflow-Artefakt vor dem DROP; Zeilenzahl der Datei muss der
      # Zaehlung entsprechen, sonst Abbruch ohne DROP (laeuft auch bei 0).
      - name: Altfelder archivieren (Waechter 0017)
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          pnpm run archiv-altfelder
          test -f altfelder-archiv.json || { echo '::error::Archivdatei fehlt — kein DROP.'; exit 1; }

      - name: Altfelder-Archiv hochladen
        uses: actions/upload-artifact@v7
        with:
          name: altfelder-archiv-production
          path: packages/db/altfelder-archiv.json

      # E33 Schritt 3 (0022): Vorpruefung — bricht mit der Liste der
      # Belegnummern ab, wenn ein Beleg der oberen vier Typen kein
      # gueltig_bis traegt; die Migration schreibt keinen Fachwert, das
      # Nachtragen geschieht in der Anwendung. Nach 0022 Nachweis, dass der
      # CHECK greift. Nur lesend bzw. zurueckgerollt; bleibt dauerhaft stehen.
      - name: Fristen-Vorpruefung (gueltig_bis, E33)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db beleg-frist-check

      - name: Migrate Production-DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db migrate

      - name: Angewendeten Stand ausgeben
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db schema-stand

      # Kein Dispatch des Deploys mehr (Betriebs-PR, 05.10.2026): Der Push-Lauf
      # von deploy.yml wartet im schema-gate auf diese Migration und deployt
      # danach selbst. Ein zweiter Lauf per Dispatch waere ein Doppel-Deploy.
