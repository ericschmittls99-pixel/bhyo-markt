# TEMPORAER (AP1i PR 7, DoD): Kennzahl-Gegenrechnung gegen die Preview-DB.
# Feste, rein lesende Abfragen — wird vor dem Merge wieder entfernt.
name: PR7 Gegenrechnung
on:
  push:
    branches: [ap1i-auswertung]
jobs:
  gegenrechnung:
    runs-on: ubuntu-latest
    steps:
      - name: Kennzahlen aus der Preview-DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: |
          psql "$DATABASE_URL" -At -c "select 'biomasse: anzahl='||count(*)||' sum_atro='||coalesce(sum(menge_atro),0) from biomassestrom;"
          psql "$DATABASE_URL" -At -c "select 'output: anzahl='||count(*) from output_bedarf;"
          psql "$DATABASE_URL" -At -c "select 'biomasse geprueft='||count(*) filter (where status='geprueft')||' in_pruefung='||count(*) filter (where status='in_pruefung') from biomassestrom;"
          psql "$DATABASE_URL" -At -c "select 'output geprueft='||count(*) filter (where status='geprueft')||' in_pruefung='||count(*) filter (where status='in_pruefung') from output_bedarf;"
          psql "$DATABASE_URL" -At -c "select 'jahr '||j||': sum_atro='||coalesce(sum(menge_atro) filter (where coalesce(extract(year from zeitraum_von),2026)<=j and coalesce(extract(year from zeitraum_bis),2031)>=j),0) from biomassestrom, generate_series(2026,2031) j group by j order by j;"
          psql "$DATABASE_URL" -At -c "select 'zeitraeume: '||string_agg(coalesce(zeitraum_von::text,'-')||'..'||coalesce(zeitraum_bis::text,'-'),' | ') from biomassestrom;"
          # Einmalig fuer die E14-Vorzeichen-Pruefung: alle Feedstock-Preise
          psql "$DATABASE_URL" -At -c "select 'E14 | '||coalesce(a.name,'-')||' | '||coalesce(m.label,'-')||' | min='||coalesce(b.preis_min::text,'-')||' mittel='||coalesce(b.preis_mittel::text,'-')||' max='||coalesce(b.preis_max::text,'-') from biomassestrom b left join akteur a on a.id=b.akteur_id left join materialart m on m.code=b.materialart_code where b.preis_min is not null or b.preis_mittel is not null or b.preis_max is not null order by m.label;"
