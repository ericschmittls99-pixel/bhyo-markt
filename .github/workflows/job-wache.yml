name: Job-Wache (Verifikations-Job, nur lesen)

# AP2.4 PR b (E63), Betrieb 04.10.2026: Mehrfach taeglich pruefen, dass der
# Verifikations-Job (Cloudflare Cron, 05:00 Berlin) fuer den faelligen
# Stichtag mit ergebnis = ok in job_lauf steht — ab 05:30 Berlin heute, davor
# gestern (packages/db/src/job-wache-stichtag.ts). JEDER Lauf prueft; es gibt
# keine Stundensperre mehr (GitHub startete die geplanten Laeufe 5–6 Stunden
# zu spaet, die alte Wache endete dann gruen ohne Pruefung). Krumme Minuten,
# weil volle Stunden bei GitHub am staerksten verzoegert werden; Doppellaeufe
# sind lesend und harmlos. Nur SELECT ueber die Lese-Berechtigung (Environment
# production-lesend, Branch-Policy main). Rot = GitHub benachrichtigt per
# Mail. Manuell: Stichtag angeben (Rot-Nachweis mit einem Tag ohne Lauf).
on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "43 6 * * *"
    - cron: "29 10 * * *"
    - cron: "11 15 * * *"
  workflow_dispatch:
    inputs:
      stichtag:
        description: "Stichtag JJJJ-MM-TT (leer = heute, Berlin)"
        required: false

jobs:
  wache:
    runs-on: ubuntu-24.04
    environment: production-lesend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Job-Wache (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db job-wache ${{ inputs.stichtag }}
