name: job-wache (Verifikations-Job, nur lesen)

# AP2.4 PR b (E63), Betrieb 04.10.2026: Mehrfach taeglich pruefen, dass der
# Verifikations-Job (Cloudflare Cron, 05:00 Berlin) fuer den faelligen
# Stichtag mit ergebnis = ok in job_lauf steht — ab 05:30 Berlin heute, davor
# gestern (packages/db/src/job-wache-stichtag.ts). JEDER Lauf prueft; es gibt
# keine Stundensperre mehr (GitHub startete die geplanten Laeufe 5–6 Stunden
# zu spaet, die alte Wache endete dann gruen ohne Pruefung). Krumme Minuten,
# weil volle Stunden bei GitHub am staerksten verzoegert werden; Doppellaeufe
# sind lesend und harmlos. Nur SELECT ueber die Lese-Berechtigung (Environment
# production-lesend, Branch-Policy main). Rot = GitHub benachrichtigt per
# Mail. Manuell: Stichtag angeben (Rot-Nachweis mit einem Tag ohne Lauf).
on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "43 6 * * *"
    - cron: "29 10 * * *"
    - cron: "11 15 * * *"
  workflow_dispatch:
    inputs:
      stichtag:
        description: "Stichtag JJJJ-MM-TT (leer = heute, Berlin)"
        required: false
      backup_max_stunden:
        description: "Backup: hoechstes Alter des letzten Erfolgs in Stunden (leer = 26; kleiner nur fuer den Rot-Nachweis)"
        required: false
      restore_max_tage:
        description: "Restore-Test: hoechstes Alter des letzten Erfolgs in Tagen (leer = 8; kleiner nur fuer den Rot-Nachweis)"
        required: false

jobs:
  wache:
    runs-on: ubuntu-24.04
    environment: production-lesend
    permissions:
      contents: read
      actions: read # Laeufe von Backup und Restore-Test lesen (laeufe-wache)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # E73 (08.10.2026): Logs eines oeffentlichen Repos sind oeffentlich — Host und
      # Datenbanknutzer der Verbindungs-URL werden maskiert, bevor ein Skript sie nennt.
      # packages/db/src/log-maske.ts: per Muster, nie werfend, kein Fehlerpfad gibt Eingaben aus (Test log-maske.test.ts).
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db exec tsx src/log-maske.ts
      - name: Job-Wache (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db job-wache ${{ inputs.stichtag }}

      # Betriebs-PR (Eric, 05.10.2026): zusaetzlich ueber die GitHub-API, nur
      # lesend — letzter erfolgreicher Backup-Lauf <= 26 h, letzter erfolgreicher
      # restore-woechentlich <= 8 Tage, sonst rot. Laeuft auch, wenn die
      # DB-Wache rot war (always), damit beide Befunde im selben Lauf stehen.
      - name: Laeufe-Wache (Backup <= 26 h, Restore-Test <= 8 Tage, GitHub-API nur lesen)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/backup.yml/runs?status=success&per_page=1" > /tmp/backup.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/restore-woechentlich.yml/runs?status=success&per_page=1" > /tmp/restore.json
          # In Anfuehrungszeichen: eine leere Eingabe bleibt ein leeres Argument. Ohne
          # sie rutschte restore_max_tage an die Stelle von backup_max_stunden
          # (Rot-Nachweis 05.10.2026, Lauf 37327647001 meldete faelschlich das Backup).
          pnpm --filter @bhyo/db laeufe-wache /tmp/backup.json /tmp/restore.json "${{ inputs.backup_max_stunden }}" "${{ inputs.restore_max_tage }}"
