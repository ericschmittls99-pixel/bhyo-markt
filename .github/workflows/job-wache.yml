name: Job-Wache (Verifikations-Job, nur lesen)

# AP2.4 PR b (E63): Taeglich um 06:00 Berlin pruefen, dass der
# Verifikations-Job (Cloudflare Cron, 05:00 Berlin) fuer heute mit ergebnis =
# ok in job_lauf steht. Zwei Cron-Zeiten (04:00 und 05:00 UTC), die Wache
# prueft nur in der Berliner Stunde 6 — genau einmal taeglich, auch ueber die
# Zeitumstellung. Nur SELECT ueber die Lese-Berechtigung (Environment
# production-lesend, Branch-Policy main). Rot = GitHub benachrichtigt per
# Mail. Manuell: Stichtag angeben (Rot-Nachweis mit einem Tag ohne Lauf).
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      stichtag:
        description: "Stichtag JJJJ-MM-TT (leer = heute, Berlin)"
        required: false

jobs:
  wache:
    runs-on: ubuntu-24.04
    environment: production-lesend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Job-Wache (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
          # Manuell gestartet: sofort pruefen, nicht auf die Stunde warten.
          JOB_WACHE_STUNDE: ${{ github.event_name == 'workflow_dispatch' && 'immer' || '6' }}
        run: pnpm --filter @bhyo/db job-wache ${{ inputs.stichtag }}
