# TEMPORAER (AP2.3 PR a): Beweis, dass sich die Faelligkeit durch die
# Umstellung nicht aendert — gegen die Preview nach Migration 0029. Nur
# SELECT. Wird vor dem Merge geloescht.
name: tmp Fristen-Paritaet
on:
  push:
    branches: [ap23-parameter]
jobs:
  paritaet:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Faelligkeit vor/nach (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        working-directory: packages/db
        run: pnpm exec tsx src/tmp-fristen-paritaet.ts
