name: Seed Preview (v2)

# NUR manuell (workflow_dispatch) und NUR gegen die Preview-DB: der Job kennt
# ausschliesslich das Secret DATABASE_URL_PREVIEW (dasselbe, mit dem der
# Deploy-Workflow Preview-Migrationen faehrt); ein Production-DB-Secret
# existiert im Repo nicht. Das Skript selbst prueft die URL zusaetzlich und
# kennt kein Override-Flag.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # E73 (08.10.2026): Logs eines oeffentlichen Repos sind oeffentlich — Host und
      # Datenbanknutzer der Verbindungs-URL werden maskiert, bevor ein Skript sie nennt.
      # Per Muster, nicht per URL-Parser: das Leseweg-Secret hielt new URL() nicht stand (Lauf 37765054123).
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: node -e 'for (const [k, v] of Object.entries(process.env)) { if (!k.startsWith("URL_") || !v) continue; const h = v.match(/@([^/?:\s]+)/); if (h) console.log("::add-mask::" + h[1]); const u = v.match(/\/\/([^:@\/]+)[:@]/); if (u) console.log("::add-mask::" + decodeURIComponent(u[1])); }'
      - name: Seed Preview-DB
        env:
          SEED_DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web seed:preview
      # AP2.5 PR a1 (E66): Akteur-Testdaten (Sitz des Bestands, 40+ Akteure mit
      # Dubletten-Kandidaten, Verwaisten, Unvollstaendigen, ohne Sektor) — nach
      # dem Strom-Seed, derselbe Schutz (nur SEED_DATABASE_URL_PREVIEW).
      - name: Seed Akteure (AP2.5)
        env:
          SEED_DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web seed:akteure
