name: Deploy

on:
  push:
    branches: [main]
  # ready_for_review: Ein Entwurf bekommt beim Umschalten auf „bereit" den
  # Preview-Deploy samt Migration, den er als Entwurf nicht bekam (Regel Eric
  # 01.10.2026: auf die geteilte Preview migriert nur der PR, der als Naechster
  # gemergt wird; Entwuerfe laufen durch Typen und Tests, ohne Preview-Deploy).
  pull_request:
    # ready_for_review: Ein Entwurf bekommt beim Umschalten auf „bereit" den
    # Preview-Deploy samt Migration, den er als Entwurf nicht bekam (Regel Eric
    # 01.10.2026: auf die geteilte Preview migriert nur der PR, der als Naechster
    # gemergt wird; Entwuerfe laufen durch Typen und Tests, ohne Preview-Deploy).
    # labeled: das Label preview-migrieren loest den Lauf aus, der die Preview migriert.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # Notausgang (kein Ersatz fuer den push-Trigger): beim PR-7-Merge hat
  # GitHub fuer den Squash-Commit kein PushEvent erzeugt (Events-API leer,
  # kein Token-/paths-Problem — Einzelfall-Drop). Damit laesst sich der
  # Production-Deploy ohne leeren Trigger-Commit nachholen.
  workflow_dispatch:
    inputs:
      # Break-Glass fuer das schema-gate (E21): Ein fehlerhaftes Gate wuerde
      # sonst auch den Deploy seiner eigenen Reparatur blockieren —
      # geschlossene Schleife. Greift NUR auf dem dispatch-Pfad, nie bei
      # einem Push; bewusst unbequem (woertliche Eingabe).
      gate_umgehen:
        description: 'NOTAUSGANG: schema-gate umgehen — nur bei kaputtem Gate, woertlich "ja" eintippen'
        required: false
        default: ""

# Pro Ziel-Ref nur ein Deploy gleichzeitig. CI-Diaet (Betriebs-PR 3, Eric
# 08.10.2026): JEDER ueberholte PR-Lauf desselben Branches wird abgebrochen
# (neuer Push, „bereit", Label) — keine aktive Wartezeit auf ueberholte Laeufe.
# main-Deploys laufen weiter nacheinander (nie abgebrochen). Der „cancelled"-
# Check, den ein abgebrochener Lauf am Head hinterlaesst, stoert den Merge nicht
# mehr: merge-sicher.sh wertet je Check-Namen nur den juengsten Lauf (Test in
# scripts/tests/freigabe-test.sh).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Review Eric (24.09.2026): Das Deploy-Ziel hing allein am EVENT —
  # `pull_request` deployt auf die Preview, JEDES andere Event nach
  # Production. Ein workflow_dispatch auf einem Feature- oder tmp-Branch
  # haette dessen ungeprueften Code nach Production geschoben; der Notausgang
  # war nie auf main beschraenkt. Diese Wache macht den Ref zur zweiten
  # Bedingung: Production ausschliesslich von refs/heads/main, Preview
  # weiterhin von jedem Branch. Sie laeuft VOR Gate und Deploy, beide haengen
  # per `needs` daran — ein falscher Ref bricht den Lauf ab, statt ihn still
  # zu ueberspringen.
  ziel-wache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # CI-Diaet: ist der PR eine reine Doku-Aenderung? Dann laeuft nur der
      # Konfliktmarker-Check (siehe aenderungen-Schritt unten).
      nur_doku: ${{ steps.aenderungen.outputs.nur_doku }}
    steps:
      - name: Deploy-Ziel gegen den Ref pruefen
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "ZIELWACHE event=$EVENT ref=$REF -> Preview (jeder Branch zulaessig)"
            exit 0
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=PRODUCTION NUR VON MAIN::Dieser Lauf (event=$EVENT, ref=$REF) wuerde nach Production deployen, laeuft aber nicht auf refs/heads/main. Abgebrochen. Fuer einen Preview-Deploy eines Branches einen Pull Request oeffnen; ein workflow_dispatch gehoert ausschliesslich auf main."
            exit 1
          fi
          echo "ZIELWACHE event=$EVENT ref=$REF -> Production (zulaessig)"
      # CI-Diaet (Betriebs-PR 3, Eric 08.10.2026): Ein PR, der NUR Doku
      # aendert (Muster in scripts/nur-doku-muster.txt: *.md, docs/**,
      # Screenshots — dasselbe Muster liest merge-sicher.sh), laeuft nur durch
      # den Konfliktmarker-Check, ohne Wegwerf-DB und ohne Deploy. Alles andere
      # ist ein voller Lauf: „bereit" heisst immer Wegwerf-DB und DB-Checks
      # (SQL steckt auch in apps/web/lib — ein Pfadfilter wuerde Schutz
      # verlieren). Geaenderte Dateien und Muster kommen ueber die API vom
      # PR-Head (kein Checkout); main und Dispatch sind nie „nur Doku"; ist
      # etwas nicht lesbar, gilt der volle Lauf (fail closed).
      # Folge-PR (Eric 08.10.2026): das MUSTER kommt von der BASIS (main),
      # nicht vom PR-Head — sonst koennte ein PR seine eigene Einstufung
      # aendern. Aendert ein PR die Musterdatei selbst, ist er ein Code-PR.
      - name: Reine Doku-Aenderung? (nur Pull Requests)
        id: aenderungen
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASIS: ${{ github.event.pull_request.base.sha }}
          KOPF: ${{ github.event.pull_request.head.sha }}
        run: |
          nur_doku=false
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASIS" ] && [ -n "$KOPF" ]; then
            muster=$(gh api "repos/${{ github.repository }}/contents/scripts/nur-doku-muster.txt?ref=$BASIS" --jq .content 2>/dev/null | base64 -d | grep -v '^#' | head -1 || true)
            if [ -n "$muster" ] && dateien=$(gh api --paginate "repos/${{ github.repository }}/compare/$BASIS...$KOPF" --jq '.files[].filename' 2>/dev/null); then
              anzahl=$(printf '%s\n' "$dateien" | grep -c . || true)
              doku=$(printf '%s\n' "$dateien" | grep -cE "$muster" || true)
              musterdatei=$(printf '%s\n' "$dateien" | grep -cx 'scripts/nur-doku-muster.txt' || true)
              if [ "$anzahl" -gt 0 ] && [ "$doku" -eq "$anzahl" ] && [ "$musterdatei" -eq 0 ]; then nur_doku=true; fi
              echo "AENDERUNGEN dateien=$anzahl doku=$doku musterdatei=$musterdatei nur_doku=$nur_doku"
            else
              echo "AENDERUNGEN Vergleich oder Muster nicht lesbar — voller Lauf"
            fi
          else
            echo "AENDERUNGEN event=$EVENT — voller Lauf"
          fi
          echo "nur_doku=$nur_doku" >> "$GITHUB_OUTPUT"

  # E21 (22.09.2026): Vorab-Check statt Auto-Migration — dieser Workflow
  # migriert Production NIE selbst. Migrationen laufen ausschliesslich ueber
  # den manuell ausgeloesten Workflow migrate-production.yml (Leitplanke
  # "Produktions-DB nur mit ausdruecklicher Freigabe"). Das Gate verhindert
  # das Vergessen: Es liest mit DATABASE_URL_PRODUCTION (read-only Query auf
  # drizzle.__drizzle_migrations) den angewendeten Stand und vergleicht ihn
  # mit dem Journal im Checkout. Liegt die DB zurueck, SCHLAEGT das Gate FEHL
  # ("Migration 00XX ausstehend — zuerst Migrate Production ausfuehren") und
  # der deploy-Job laeuft nicht: Es wird kein Code deployt, dessen Schema
  # fehlt — der alte Worker laeuft mit dem alten Schema weiter, das ist der
  # funktionierende Zustand (exakt umgekehrt zum Vorfall vom 22.09.).
  # Dieses Gate ist die TRAGENDE Pruefung; der Health-Check nach dem Rollout
  # ist nur zusaetzliche Bestaetigung.
  # Typen und Tests laufen VOR allem anderen; Gate und Deploy haengen per
  # `needs` daran. Branch Protection (erforderliche Checks) ist im Free-Plan
  # fuer private Repos nicht verfuegbar — diese Abhaengigkeit ist deshalb der
  # einzige technische Guard: Sind Typen oder Tests rot, erreicht der Stand
  # WEDER Preview NOCH Production. Bewusst eng: nur Typen und Tests, kein
  # Lint, keine Formatierung, keine Coverage.
  typen-und-tests:
    needs: [ziel-wache]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # CI-Diaet: reine Doku-Aenderungen (nur docs/ und Markdown) laufen nur durch
    # den Konfliktmarker-Check — kein Install, keine Typen, keine Tests.
    env:
      VOLL: ${{ needs.ziel-wache.outputs.nur_doku != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: env.VOLL == 'true'
      - uses: actions/setup-node@v7
        if: env.VOLL == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: env.VOLL == 'true'
        run: pnpm install --frozen-lockfile
      # Getrennte Schritte, damit im Log sofort sichtbar ist, was bricht.
      - name: Typen — apps/web
        if: env.VOLL == 'true'
        run: pnpm --filter web exec tsc --noEmit
      - name: Typen — packages/db
        if: env.VOLL == 'true'
        run: pnpm --filter @bhyo/db exec tsc --noEmit
      - name: Tests — apps/web
        if: env.VOLL == 'true'
        run: pnpm --filter web test -- --run
      - name: Tests — packages/db
        if: env.VOLL == 'true'
        run: pnpm --filter @bhyo/db test
      # F8/E30, E42: rechte-check — meldet jede Server-Action und jede
      # schreibende Route, die die Wache nicht mit einer Aktion der Matrix
      # aufruft. Laeuft zusaetzlich als Vitest-Fall; hier eigens, damit die
      # Luecke im Log als eigene Zeile mit Dateibezug erscheint.
      - name: rechte-check (Schreibpfade)
        if: env.VOLL == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/rechte-check.ts

      # AP2.2 PR a: eine Schreibstelle fuer das Ereignisprotokoll, jeder
      # Schreibpfad protokolliert mit einer Art (scripts/protokoll-check.ts).
      - name: protokoll-check (Ereignisprotokoll)
        if: env.VOLL == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/protokoll-check.ts

      # AP2.4 PR a (E62, D6): jede Spalte der vier Tabellen ist genau einmal
      # eingestuft (fachlich / redaktionell / technisch) — eine neue Spalte
      # ohne Einstufung ist rot (scripts/feld-check.ts).
      - name: feld-check (Feldeinstufung)
        if: env.VOLL == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/feld-check.ts

      # AP2.2 PR b: inbox_eintrag wird nur in lib/inbox geschrieben.
      - name: inbox-check (Inbox-Schreibstelle)
        if: env.VOLL == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/inbox-check.ts

      # Enum-Rename-Waechter: inbox_typ_text ist IMMUTABLE — Werte von
      # inbox_typ (und der Typ selbst) werden nie umbenannt, sonst waeren
      # Index-Praedikat und ON CONFLICT still falsch. Liste im Skript.
      - name: enum-rename-check (IMMUTABLE-Enums)
        if: env.VOLL == 'true'
        run: pnpm --filter @bhyo/db enum-rename-check

      # Waechter fuer das Freigabe-Skript (Eric 06.10.2026: bash -n reicht
      # fuer das wichtigste Sicherheitsnetz nicht): gh-Attrappe, echtes
      # Bare-Repo, Faelle fuer (e) Neustart und (f) Angleichen, siehe
      # docs/betrieb.md. Dauert ~1 min (das Skript wartet nach dem Neustart).
      - name: freigabe-test (Waechter freigabe.sh)
        if: env.VOLL == 'true'
        run: scripts/tests/freigabe-test.sh

      # AP2.7 PR g (Eric 07.10.2026): Konfliktmarker (<<<<<<<, =======, >>>>>>>
      # am Zeilenanfang) in versionierten Dateien machen den Lauf rot — beim
      # Angleichen von E68 PR 1 blieben welche in zwei Doku-Dateien stehen.
      # Rot-Nachweis: scripts/tests/konfliktmarker-test.sh (Wegwerf-Repo).
      - name: konfliktmarker-test (Rot-Nachweis des Waechters)
        if: env.VOLL == 'true'
        run: scripts/tests/konfliktmarker-test.sh
      - name: konfliktmarker-check (versionierte Dateien)
        run: scripts/konfliktmarker-check.sh

      # Betrieb (Eric 09.10.2026): "use server"-Dateien exportieren nur
      # async-Funktionen — Next.js prueft das erst im Build (Turbopack), zwei
      # Faelle fielen deshalb erst auf der Preview auf (use-server-Konstante →
      # POST 500; sync-Export → Deploy rot, #214). Statisch auf dem Syntaxbaum,
      # Rot-Nachweis in scripts/use-server-check.test.ts. Wie die anderen
      # Waechter an VOLL gebunden (CI-Diaet): eine reine Doku-Aenderung kann
      # keine "use server"-Datei anfassen.
      - name: use-server-check (nur async-Exporte)
        if: env.VOLL == 'true'
        working-directory: apps/web
        run: pnpm exec tsx scripts/use-server-check.ts

  # E68 PR 1 (Eric 06.10.2026): DB-Tests der Entwuerfe gegen eine Wegwerf-
  # Postgres im Runner statt gegen die geteilte Preview. Alle Migrationen auf
  # eine leere PostGIS, dann die Staging-Fixture der PLZ-Kette, der echte
  # Import-Schritt (ohne Sollwerte) und der Funktions-Check (Paritaet SQL/TS,
  # Rot-Faelle). Braucht keine Secrets; nichts bleibt liegen.
  wegwerf-db:
    needs: [ziel-wache]
    # CI-Diaet: nie fuer Entwuerfe (die laufen nur durch Typen, Tests und
    # Konfliktmarker) und nicht fuer reine Doku-PRs; sonst IMMER — „bereit"
    # und main heissen voller Lauf (Eric 08.10.2026).
    if: >-
      needs.ziel-wache.outputs.nur_doku != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: wegwerf
          POSTGRES_DB: bhyo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bhyo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:wegwerf@localhost:5432/bhyo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Alle Migrationen auf leere PostGIS
        working-directory: packages/db
        run: pnpm run migrate
      - name: PLZ-Staging-Fixture laden
        run: pnpm --filter @bhyo/db sql-datei fixtures/plz-wegwerf-staging.sql
      - name: PLZ-Import (Fixture, ohne Sollwerte)
        env:
          PLZ_SOLL_PRUEFEN: nein
        run: pnpm --filter @bhyo/db plz-import
      - name: PLZ-Check (Paritaet SQL/TS, Rot-Faelle, Fixture)
        env:
          PLZ_FIXTURE: ja
        run: pnpm --filter @bhyo/db plz-check

      # AP2.8 (E70): Wird-frei-Schritt des Jobs gegen die Wegwerf-DB — eigene
      # Probedaten in einer zurueckgerollten Transaktion, dieselben Faelle wie
      # lib/wird-frei.test.ts (Stufenwechsel, Einstieg, Ausfall, Erledigt,
      # Anschlussvergabe, NULL, an_bhyo, frei_ab aendert sich, Idempotenz).
      - name: Wird-frei-Probe (Job-SQL, Rot-Faelle)
        run: pnpm --filter web exec tsx scripts/wird-frei-probe.ts
      # AP2.6 PR a (E71): Kommentar-Modell (Migration 0053) und -Schreibweg gegen
      # die Wegwerf-DB — CHECK genau ein Bezug, Text-CHECK, Erwaehnungs-PK/FK,
      # Rechte je Rolle am echten Baustein, weiches Loeschen, kein Kommentartext
      # im Protokoll (mit Rot-Nachweis), CASCADE beim geloeschten Akteur.
      - name: Kommentar-Probe (Modell, Schreibweg, Rot-Faelle)
        run: pnpm --filter web exec tsx scripts/kommentar-probe.ts
      # AP2.6 PR d (E71, D14): Inbox-Aufbewahrung gegen die Wegwerf-DB — Grenzen
      # 14/60 Tage tagesgenau, ungelesene bleiben, Wird-frei-Hinweise bleiben,
      # idempotent, Parameter wirkt (Migration 0055).
      - name: Inbox-Aufbewahrungs-Probe (D14, Rot-Faelle)
        run: pnpm --filter web exec tsx scripts/inbox-aufbewahrung-probe.ts
      # E75: zeitraum_bis NULL = unbefristet gegen die Wegwerf-DB — NULL wird
      # angenommen, Ende vor Beginn weist der CHECK ab (Rot-Fall), der
      # Jahresfilter findet den unbefristeten Strom ab Beginn in jedem Jahr.
      - name: Zeitraum-Probe (E75 unbefristet, CHECK, Jahresfilter)
        run: pnpm --filter web exec tsx scripts/zeitraum-bis-probe.ts
      # AP2.9 (E76): Roundup-Probelauf auch gegen die Wegwerf-DB (ohne Nutzer:
      # 0 Empfaenger, Zeile und Idempotenz trotzdem geprueft).
      - name: Roundup-Probe (E76, Wegwerf-DB)
        run: pnpm --filter web exec tsx scripts/roundup-probe.ts

  schema-gate:
    needs: [typen-und-tests, ziel-wache]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Environment nur wegen des Secrets DATABASE_URL_PRODUCTION; das Gate
    # liest ausschliesslich.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # E73 (08.10.2026): Logs eines oeffentlichen Repos sind oeffentlich — Host und
      # Datenbanknutzer der Verbindungs-URL werden maskiert, bevor ein Skript sie nennt.
      # packages/db/src/log-maske.ts: per Muster, nie werfend, kein Fehlerpfad gibt Eingaben aus (Test log-maske.test.ts).
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db exec tsx src/log-maske.ts
      # Der Notausgang greift nur hier: Bei einem Push existiert der Input
      # nicht (leer), das Gate laeuft also IMMER. Nur ein manueller
      # workflow_dispatch mit woertlich "ja" ueberspringt die Pruefung.
      # CI-Diaet (Betriebs-PR 3, Eric 08.10.2026): kein aktives Warten mehr.
      # Liegt Production hinter dem Journal, bricht das Gate sofort mit klarer
      # Meldung ab (nicht gruen, kein Deploy). migrate-production.yml startet
      # nach seinem Erfolg den Deploy von main selbst (Dispatch); freigabe.sh
      # wartet in diesem Fall auf den Dispatch-Lauf. Exit 2 (DB nicht
      # erreichbar) bleibt eine andere Fehlerklasse.
      - name: Schema-Stand pruefen (read-only)
        if: inputs.gate_umgehen != 'ja'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          if pnpm --filter @bhyo/db schema-gate; then exit 0; fi
          rc=$?
          if [ "$rc" = "2" ]; then echo "::error::Production-DB nicht erreichbar — kein Schema-Befund."; exit 2; fi
          echo "::error::schema-gate: Production liegt hinter dem Journal — Migration ausstehend. migrate-production.yml (bestaetigung=production) starten; es loest den Deploy von main danach selbst aus. Dieser Lauf bleibt rot (kein Deploy)."
          exit 1
      - name: "NOTAUSGANG aktiv: Gate uebersprungen"
        if: inputs.gate_umgehen == 'ja'
        run: |
          echo "::warning title=SCHEMA-GATE UEBERSPRUNGEN::Break-Glass gate_umgehen=ja — der Deploy laeuft OHNE Schema-Pruefung. Nur zulaessig, wenn das Gate selbst defekt ist. Schema-Stand danach von Hand pruefen (pnpm --filter @bhyo/db schema-stand) und den Gate-Defekt sofort beheben."
          echo "=============================================================="
          echo "  NOTAUSGANG: schema-gate wurde bewusst umgangen (gate_umgehen=ja)"
          echo "=============================================================="

  deploy:
    needs: [typen-und-tests, ziel-wache, schema-gate, wegwerf-db]
    # Typen/Tests sind IMMER Vorbedingung (auch bei PRs — sonst deployt ein
    # roter Stand auf die Preview). Zusaetzlich bei main-Pushes: nur wenn das
    # schema-gate gruen ist.
    # Entwuerfe (draft) deployen NICHT auf die Preview und migrieren sie nicht
    # (Regel Eric 01.10.2026) — sie laufen nur durch typen-und-tests.
    # CI-Diaet: die Wegwerf-DB zaehlt ausdruecklich — vorher hing sie nur in
    # `needs`, und mit always() haette ein roter Wegwerf-Lauf den Deploy nicht
    # aufgehalten. „skipped" ist nur fuer Entwuerfe und reine Doku-PRs
    # zulaessig, und beide deployen ohnehin nicht (Entwurf: Regel unten;
    # Doku-PR: nur_doku).
    if: >-
      always() && !cancelled() &&
      needs.typen-und-tests.result == 'success' &&
      needs.ziel-wache.result == 'success' &&
      needs.ziel-wache.outputs.nur_doku != 'true' &&
      (needs.wegwerf-db.result == 'success' || needs.wegwerf-db.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'pull_request' ||
       needs.schema-gate.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Hyperdrive-Waechter (29.09.2026): Der Abfrage-Cache von Hyperdrive
      # liefert veraltete SELECT-Ergebnisse — ein frisch angelegter Eintrag
      # fehlt in der sofort gelesenen Liste, und die Vorpruefung auf
      # Eindeutigkeit laeuft ins Leere (Unique-Verletzung, 500). Der Cache
      # muss in BEIDEN Umgebungen aus sein. Hier wird die Konfiguration der
      # Zielumgebung gelesen, BEVOR irgendetwas deployt wird; gleicher Token
      # wie der Deploy, kein neues Secret. Kein Ergebnis ist kein Ergebnis:
      # Nicht lesbar = rot.
      - name: Hyperdrive-Waechter (Abfrage-Cache aus)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID: ${{ github.event_name == 'pull_request' && '7bf0712cc8224c32a061ef0abea561f9' || '2a873aa18f654dc4897b145cb24db7d7' }}
        run: |
          # Die geprüfte ID muss die sein, die wrangler.jsonc auch bindet.
          grep -q "\"id\": \"$HYPERDRIVE_ID\"" apps/web/wrangler.jsonc \
            || { echo "::error::Hyperdrive-ID $HYPERDRIVE_ID steht nicht in apps/web/wrangler.jsonc — Waechter und Bindung sind auseinandergelaufen."; exit 1; }
          antwort=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$HYPERDRIVE_ID")
          echo "$antwort" | jq -c '{success, errors, name: .result.name, caching: .result.caching}'
          echo "$antwort" | jq -e '.success == true' >/dev/null \
            || { echo "::error::Hyperdrive-Konfiguration $HYPERDRIVE_ID nicht lesbar (Token-Recht Hyperdrive:Read?)."; exit 1; }
          echo "$antwort" | jq -e '.result.caching.disabled == true' >/dev/null \
            || { echo "::error::Hyperdrive-Abfrage-Cache ist in der Zielumgebung AN (caching.disabled != true). Deploy abgebrochen."; exit 1; }

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      # E73 (08.10.2026): Logs eines oeffentlichen Repos sind oeffentlich — Host und
      # Datenbanknutzer der Verbindungs-URL werden maskiert, bevor ein Skript sie nennt.
      # packages/db/src/log-maske.ts: per Muster, nie werfend, kein Fehlerpfad gibt Eingaben aus (Test log-maske.test.ts).
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db exec tsx src/log-maske.ts

      # CI-Diaet: der Archiv-Waechter 0017 (Altfelder) entfaellt hier — die
      # Spalten sind seit 0017 weg, der Schritt lud ein leeres Artefakt hoch.

      # E33 Schritt 3: Vorpruefung VOR der Migration — ein Beleg der oberen
      # vier Typen ohne gueltig_bis bricht hier mit Belegnummern ab, statt
      # 0022 in einen Constraint-Fehler laufen zu lassen (die Migration
      # schreibt keinen Fachwert). Nach 0022 weist derselbe Schritt nach,
      # dass der CHECK greift.
      - name: Fristen-Vorpruefung (gueltig_bis, E33)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-frist-check

      # Label preview-migrieren (Betriebs-PR, Eric 05.10.2026): Nur der naechste
      # zu mergende PR migriert die geteilte Preview — er traegt das Label. Ohne
      # Label laufen die DB-Checks trotzdem; traegt der PR eine neue Migration,
      # melden sie „Journal voraus" (rot), bis das Label gesetzt ist. Der Runner
      # (src/migrieren.ts) gibt Statement, Code und Meldung eines Fehlers aus.
      - name: Migrate Preview-DB (nur mit Label preview-migrieren)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview-migrieren')
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm run migrate

      # E23: Paritaet der Qualitaets-Ableitung — DB-Funktion qualitaetsstufe()
      # gegen deriveQualitaet ueber alle Ankerfaelle, gegen die echte
      # Preview-DB (kein Mock). Abweichung bricht den Deploy ab.
      - name: Qualitaets-Paritaet (DB vs. TS)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web exec tsx scripts/qualitaet-paritaet.ts

      # F0b: dauerhafte DB-Checks der raeumlichen Verwaltungszuordnung —
      # Grenzpunkt (ST_Covers + DISTINCT ON), Rheingrenze RP/BW,
      # Eindeutigkeit der View. Gegen die echte Preview-DB.
      - name: Verwaltungs-Check (strom_verwaltung)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db verwaltung-check

      # E28/E29: Belegnummer — Vollstaendigkeit, Format, und der
      # Unveraenderlichkeits-Trigger in beide Richtungen (gleicher Wert geht
      # durch, echte Aenderung scheitert). Gegen die echte Preview-DB.
      - name: Belegnummer-Check (beleg_nr)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-nr-check

      # F8/E30: Benutzertabelle — mindestens ein aktiver Admin (fail closed
      # ohne Admin heisst: zugesperrt), Kleinschreibung der E-Mails, und der
      # CHECK muss wirklich greifen. Gegen die echte Preview-DB.
      - name: Benutzer-Check (benutzer)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db benutzer-check

      # E44 (AP2.1 PR b): Rolle pruefer im Enum, Sperrspalten mit CHECK
      # "beide NULL oder beide gesetzt" (muss greifen), strom_zuweisung mit
      # CHECK "genau ein Strom" (muss greifen) und partiellen Unique-Indizes.
      - name: Sperre-Check (Sperren, Zuweisungen)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db sperre-check

      # AP2.2 PR a: Ereignisprotokoll — Enum/Spalten/CHECK stehen, der CHECK
      # greift (Zeile ohne Urheber abgewiesen), Rollback hinterlaesst nichts.
      - name: Protokoll-Check (Ereignisprotokoll)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db protokoll-check

      # AP2.2 PR b: Inbox — Strukturen stehen, Unique-Index und CHECK greifen,
      # Buendelung per Upsert (anzahl + 1, ungelesen; nach erledigt neuer Eintrag).
      - name: Inbox-Check (Inbox)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db inbox-check

      # AP2.3 PR a (E60): Parameter mit Verlauf — Funktion, CHECK und Trigger
      # greifen (nie rueckwirkend, unveraenderlich, Ruecknahme nur kuenftig),
      # Wirksamkeit ab Datum, kein Standardwert.
      - name: Parameter-Check (Parameter mit Verlauf)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db parameter-check

      # Sektorliste (F5 PR B; seit AP2.3 PR b strukturell, E59): Spalten id/aktiv,
      # eindeutiger Index auf lower(btrim(label)) und der Code-CHECK greifen
      # ("abnehmer"/"ohne_sektor" nie ein Sektor), kein Akteur traegt einen
      # unbekannten Sektor, der Fremdschluessel greift, Akteur-Anlage mit/ohne
      # Sektor geht durch, ein Akteur an einem deaktivierten Sektor bleibt gueltig.
      - name: Sektor-Check (sektor)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db sektor-check

      # AP2.4 PR a (E62): Verifikationsmodell — strom_verifikation() steht und
      # leitet jeden Zustand richtig ab (ungeprueft, in_pruefung, gueltig,
      # abgelaufen, als_abgelaufen_markiert, pruefdatum_unbekannt), die
      # Typ-Frist zaehlt ab dem Prueftag, gueltig_bis gilt fuer die oberen
      # vier Typen, die Markierung wertet die Qualitaet ab (D3).
      - name: Verifikation-Check (strom_verifikation)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db verifikation-check

      # AP2.5 PR b (E66/E57): Kontaktpersonen — Struktur, kein Umhaengen,
      # Laengengrenzen, Hinweis-Index und die DSGVO-Probe (Name nach dem
      # Loeschen in keiner Spalte mehr auffindbar). Zurueckgerollt.
      - name: Kontaktperson-Check (kontaktperson)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db kontaktperson-check

      # AP2.7 PR a (E67): Import-Datenmodell — Struktur (Migration 0043), keine
      # Personen-Spalte in den Import-Tabellen, CHECK gegen Personen-Schluessel
      # in import_zeile.felder (Rot-Nachweis im Check selbst, zurueckgerollt).
      - name: import-check (Import-Datenmodell, E67)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db import-check

      # AP2.7 PR b (E67): Rot-Nachweis gegen die Preview-DB — der Probelauf
      # veraendert nichts (Zaehler vorher = nachher nach absichtlichem Rollback)
      # und ein gescheiterter Savepoint laesst die uebrigen Zeilen durch.
      - name: probelauf-rollback-check (Rollback und Savepoint, E67)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db probelauf-rollback-check

      # AP2.5 PR c (E66): Dubletten — Struktur (pg_trgm, akteur_name_norm,
      # akteur_keine_dublette), Paritaet SQL ↔ TypeScript ueber die geteilten
      # Fixtures, Trigger-Ausnahme nur mit Zusammenfuehrungs-Ereignis, Loeschen
      # eines Akteurs mit Strom per FK abgewiesen. Zurueckgerollt.
      - name: Dubletten-Check (akteur_name_norm, keine Dublette, Trigger)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db dubletten-check

      # AP2.4 PR b (E63): Probe des Verifikations-Jobs gegen die Preview —
      # Idempotenz (zweiter Lauf erzeugt nichts), Nachholen am spaeteren
      # Stichtag, Empfaenger-Fallback, D3/ohne Beleg ohne Hinweis. Eine
      # zurueckgerollte Transaktion, nichts bleibt liegen.
      - name: Job-Probe (Verifikations-Hinweise)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web exec tsx scripts/job-probe.ts

      # AP2.9 (E76): Roundup-Probelauf gegen die Preview-DB im Probemodus —
      # je Nutzer „wuerde senden: ja/nein" und Zaehler, nur Nutzer-IDs im Log,
      # job_lauf-Zeile, Idempotenz, Wochenende. Zurueckgerollt, nichts gesendet.
      - name: Roundup-Probe (E76, Probemodus)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web exec tsx scripts/roundup-probe.ts

      # E34: Beleg-Zusicherungen — sieben Enum-Werte, der Quellenangabe-CHECK
      # greift, und JEDER Schreibpfad auf beleg (Formular-Insert/-Update,
      # Seed-Insert) geht fuer alle Typen durch, mit der Stufe der Matrix.
      # Zurueckgerollt, nichts bleibt liegen.
      - name: Beleg-Check (beleg)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-check

      # E34: Zielnachweis auf der Preview nach der Migration — WECHSEL muss
      # 0 sein (gespeicherte Stufe folgt der Matrix); GUELTIG_BIS_FEHLT zeigt
      # den Rueckstand fuer Schritt 3. Nur lesen, informativ.
      - name: Abweichungsliste Belege (Preview, nur lesen)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-abweichung

      - name: Build (OpenNext)
        working-directory: apps/web
        env:
          # Echter Commit-SHA statt "dev" in /api/health. Bei PRs der Head-Commit,
          # sonst der gepushte Commit.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec opennextjs-cloudflare build

      # Push auf main -> Production (Top-Level-Umgebung).
      - name: Deploy Production
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env=""

      # E21: Nach dem Rollout /api/health befragen — meldet die Antwort
      # "schema: behind", SCHLAEGT der Deploy FEHL. Diese Abfrage ist NUR
      # zusaetzliche Bestaetigung: die tragende Pruefung ist das schema-gate
      # oben, das direkt mit der DB spricht. Ohne Access-Service-Token
      # (Secrets CF_ACCESS_CLIENT_ID/-SECRET; Access faengt curl sonst mit
      # 302 ab) wird der Check uebersprungen — ohne Luecke.
      - name: Health-Check Production (Schema)
        if: github.event_name != 'pull_request'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::warning::Health-Check uebersprungen: CF_ACCESS_CLIENT_ID/-SECRET (Access-Service-Token) fehlen als Secrets."
            exit 0
          fi
          antwort=$(curl -sS --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://bhyo-markt.bhyo.workers.dev/api/health)
          echo "$antwort"
          echo "$antwort" | grep -q '"schema":"ok"' || { echo "::error::Production-Schema liegt zurueck oder Health nicht lesbar."; exit 1; }

      # Pull Request -> Preview-Umgebung.
      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env preview

  # Haertung (Entscheidung Eric, 29.09.2026, Punkt 3): Nach jedem main-Deploy
  # laeuft der Leseweg automatisch als letzter Schritt — nur lesend, ueber die
  # Leserolle bhyo_leser (Environment production-lesend, kein Schreibrecht).
  # Ein Fehlschlag macht den Lauf rot: Damit greifen die datenpruefenden
  # Checks (Zielnachweis, Abweichungsliste, Protokoll- und Inbox-Messung)
  # auch gegen Production, nicht nur gegen die Preview.
  lese-diagnose:
    needs: [deploy]
    if: github.event_name != 'pull_request' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    environment: production-lesend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # E73 (08.10.2026): Logs eines oeffentlichen Repos sind oeffentlich — Host und
      # Datenbanknutzer der Verbindungs-URL werden maskiert, bevor ein Skript sie nennt.
      # packages/db/src/log-maske.ts: per Muster, nie werfend, kein Fehlerpfad gibt Eingaben aus (Test log-maske.test.ts).
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db exec tsx src/log-maske.ts
      - name: Zielnachweis + Schreibversuch (muss scheitern)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db lese-diagnose
      - name: Abweichungsliste Belege (E34, nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db beleg-abweichung
      - name: Protokoll- und Inbox-Messung (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db protokoll-messung
