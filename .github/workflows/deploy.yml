name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Notausgang (kein Ersatz fuer den push-Trigger): beim PR-7-Merge hat
  # GitHub fuer den Squash-Commit kein PushEvent erzeugt (Events-API leer,
  # kein Token-/paths-Problem — Einzelfall-Drop). Damit laesst sich der
  # Production-Deploy ohne leeren Trigger-Commit nachholen.
  workflow_dispatch:
    inputs:
      # Break-Glass fuer das schema-gate (E21): Ein fehlerhaftes Gate wuerde
      # sonst auch den Deploy seiner eigenen Reparatur blockieren —
      # geschlossene Schleife. Greift NUR auf dem dispatch-Pfad, nie bei
      # einem Push; bewusst unbequem (woertliche Eingabe).
      gate_umgehen:
        description: 'NOTAUSGANG: schema-gate umgehen — nur bei kaputtem Gate, woertlich "ja" eintippen'
        required: false
        default: ""

# Pro Ziel-Ref nur ein Deploy gleichzeitig; laufende überholte Deploys abbrechen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Review Eric (24.09.2026): Das Deploy-Ziel hing allein am EVENT —
  # `pull_request` deployt auf die Preview, JEDES andere Event nach
  # Production. Ein workflow_dispatch auf einem Feature- oder tmp-Branch
  # haette dessen ungeprueften Code nach Production geschoben; der Notausgang
  # war nie auf main beschraenkt. Diese Wache macht den Ref zur zweiten
  # Bedingung: Production ausschliesslich von refs/heads/main, Preview
  # weiterhin von jedem Branch. Sie laeuft VOR Gate und Deploy, beide haengen
  # per `needs` daran — ein falscher Ref bricht den Lauf ab, statt ihn still
  # zu ueberspringen.
  ziel-wache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy-Ziel gegen den Ref pruefen
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "ZIELWACHE event=$EVENT ref=$REF -> Preview (jeder Branch zulaessig)"
            exit 0
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=PRODUCTION NUR VON MAIN::Dieser Lauf (event=$EVENT, ref=$REF) wuerde nach Production deployen, laeuft aber nicht auf refs/heads/main. Abgebrochen. Fuer einen Preview-Deploy eines Branches einen Pull Request oeffnen; ein workflow_dispatch gehoert ausschliesslich auf main."
            exit 1
          fi
          echo "ZIELWACHE event=$EVENT ref=$REF -> Production (zulaessig)"

  # E21 (22.09.2026): Vorab-Check statt Auto-Migration — dieser Workflow
  # migriert Production NIE selbst. Migrationen laufen ausschliesslich ueber
  # den manuell ausgeloesten Workflow migrate-production.yml (Leitplanke
  # "Produktions-DB nur mit ausdruecklicher Freigabe"). Das Gate verhindert
  # das Vergessen: Es liest mit DATABASE_URL_PRODUCTION (read-only Query auf
  # drizzle.__drizzle_migrations) den angewendeten Stand und vergleicht ihn
  # mit dem Journal im Checkout. Liegt die DB zurueck, SCHLAEGT das Gate FEHL
  # ("Migration 00XX ausstehend — zuerst Migrate Production ausfuehren") und
  # der deploy-Job laeuft nicht: Es wird kein Code deployt, dessen Schema
  # fehlt — der alte Worker laeuft mit dem alten Schema weiter, das ist der
  # funktionierende Zustand (exakt umgekehrt zum Vorfall vom 22.09.).
  # Dieses Gate ist die TRAGENDE Pruefung; der Health-Check nach dem Rollout
  # ist nur zusaetzliche Bestaetigung.
  # Typen und Tests laufen VOR allem anderen; Gate und Deploy haengen per
  # `needs` daran. Branch Protection (erforderliche Checks) ist im Free-Plan
  # fuer private Repos nicht verfuegbar — diese Abhaengigkeit ist deshalb der
  # einzige technische Guard: Sind Typen oder Tests rot, erreicht der Stand
  # WEDER Preview NOCH Production. Bewusst eng: nur Typen und Tests, kein
  # Lint, keine Formatierung, keine Coverage.
  typen-und-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Getrennte Schritte, damit im Log sofort sichtbar ist, was bricht.
      - name: Typen — apps/web
        run: pnpm --filter web exec tsc --noEmit
      - name: Typen — packages/db
        run: pnpm --filter @bhyo/db exec tsc --noEmit
      - name: Tests — apps/web
        run: pnpm --filter web test -- --run
      - name: Tests — packages/db
        run: pnpm --filter @bhyo/db test
      # F8/E30: Meldet jede Server-Action und jede schreibende Route, die die
      # Wache nicht aufruft. Laeuft zusaetzlich als Vitest-Fall; hier eigens,
      # damit die Luecke im Log als eigene Zeile mit Dateibezug erscheint.
      - name: Wache-Abdeckung (Schreibpfade)
        working-directory: apps/web
        run: pnpm exec tsx scripts/wache-abdeckung.ts

  schema-gate:
    needs: [typen-und-tests, ziel-wache]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Environment nur wegen des Secrets DATABASE_URL_PRODUCTION; das Gate
    # liest ausschliesslich.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Der Notausgang greift nur hier: Bei einem Push existiert der Input
      # nicht (leer), das Gate laeuft also IMMER. Nur ein manueller
      # workflow_dispatch mit woertlich "ja" ueberspringt die Pruefung.
      - name: Schema-Stand pruefen (read-only)
        if: inputs.gate_umgehen != 'ja'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db schema-gate
      - name: "NOTAUSGANG aktiv: Gate uebersprungen"
        if: inputs.gate_umgehen == 'ja'
        run: |
          echo "::warning title=SCHEMA-GATE UEBERSPRUNGEN::Break-Glass gate_umgehen=ja — der Deploy laeuft OHNE Schema-Pruefung. Nur zulaessig, wenn das Gate selbst defekt ist. Schema-Stand danach von Hand pruefen (pnpm --filter @bhyo/db schema-stand) und den Gate-Defekt sofort beheben."
          echo "=============================================================="
          echo "  NOTAUSGANG: schema-gate wurde bewusst umgangen (gate_umgehen=ja)"
          echo "=============================================================="

  deploy:
    needs: [typen-und-tests, ziel-wache, schema-gate]
    # Typen/Tests sind IMMER Vorbedingung (auch bei PRs — sonst deployt ein
    # roter Stand auf die Preview). Zusaetzlich bei main-Pushes: nur wenn das
    # schema-gate gruen ist.
    if: >-
      always() && !cancelled() &&
      needs.typen-und-tests.result == 'success' &&
      needs.ziel-wache.result == 'success' &&
      (github.event_name == 'pull_request' ||
       needs.schema-gate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nur Preview: Schema-Migrationen automatisch gegen den Preview-Neon-Branch
      # anwenden, damit PRs mit Schemaaenderungen nicht mehr manuell nachgezogen
      # werden muessen. Production migriert dieser Workflow NIE — nur der
      # manuell ausgeloeste Workflow migrate-production.yml (E21). Der direkte
      # Neon-Connection-String kommt aus dem Repo-Secret, nie aus dem Repo.
      # F0b PR D: Archiv-Waechter — sichert die befuellten E7-Altfelder als
      # Workflow-Artefakt, BEVOR 0017 sie droppt (auf der Preview sind das
      # die "Test:"-Zeilen; gewollt und als Artefakt nachvollziehbar).
      # Defensiv: nach dem DROP entfaellt er mit Hinweis.
      - name: Altfelder archivieren (Waechter 0017)
        if: github.event_name == 'pull_request'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: |
          pnpm run archiv-altfelder
          test -f altfelder-archiv.json || { echo '::error::Archivdatei fehlt — kein DROP.'; exit 1; }

      - name: Altfelder-Archiv hochladen
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: altfelder-archiv-preview
          path: packages/db/altfelder-archiv.json

      - name: Migrate Preview-DB
        if: github.event_name == 'pull_request'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm exec drizzle-kit migrate

      # E23: Paritaet der Qualitaets-Ableitung — DB-Funktion qualitaetsstufe()
      # gegen deriveQualitaet ueber alle Ankerfaelle, gegen die echte
      # Preview-DB (kein Mock). Abweichung bricht den Deploy ab.
      - name: Qualitaets-Paritaet (DB vs. TS)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web exec tsx scripts/qualitaet-paritaet.ts

      # F0b: dauerhafte DB-Checks der raeumlichen Verwaltungszuordnung —
      # Grenzpunkt (ST_Covers + DISTINCT ON), Rheingrenze RP/BW,
      # Eindeutigkeit der View. Gegen die echte Preview-DB.
      - name: Verwaltungs-Check (strom_verwaltung)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db verwaltung-check

      # E28/E29: Belegnummer — Vollstaendigkeit, Format, und der
      # Unveraenderlichkeits-Trigger in beide Richtungen (gleicher Wert geht
      # durch, echte Aenderung scheitert). Gegen die echte Preview-DB.
      - name: Belegnummer-Check (beleg_nr)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-nr-check

      # F8/E30: Benutzertabelle — mindestens ein aktiver Admin (fail closed
      # ohne Admin heisst: zugesperrt), Kleinschreibung der E-Mails, und der
      # CHECK muss wirklich greifen. Gegen die echte Preview-DB.
      - name: Benutzer-Check (benutzer)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db benutzer-check

      # F5 PR B: Sektor-Referenzdaten — die acht Werte stehen, kein Akteur
      # traegt einen unbekannten Sektor, "abnehmer" ist keiner mehr, und der
      # Fremdschluessel greift wirklich.
      - name: Sektor-Check (sektor)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db sektor-check

      - name: Build (OpenNext)
        working-directory: apps/web
        env:
          # Echter Commit-SHA statt "dev" in /api/health. Bei PRs der Head-Commit,
          # sonst der gepushte Commit.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec opennextjs-cloudflare build

      # Push auf main -> Production (Top-Level-Umgebung).
      - name: Deploy Production
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env=""

      # E21: Nach dem Rollout /api/health befragen — meldet die Antwort
      # "schema: behind", SCHLAEGT der Deploy FEHL. Diese Abfrage ist NUR
      # zusaetzliche Bestaetigung: die tragende Pruefung ist das schema-gate
      # oben, das direkt mit der DB spricht. Ohne Access-Service-Token
      # (Secrets CF_ACCESS_CLIENT_ID/-SECRET; Access faengt curl sonst mit
      # 302 ab) wird der Check uebersprungen — ohne Luecke.
      - name: Health-Check Production (Schema)
        if: github.event_name != 'pull_request'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::warning::Health-Check uebersprungen: CF_ACCESS_CLIENT_ID/-SECRET (Access-Service-Token) fehlen als Secrets."
            exit 0
          fi
          antwort=$(curl -sS --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://bhyo-markt.bhyo.workers.dev/api/health)
          echo "$antwort"
          echo "$antwort" | grep -q '"schema":"ok"' || { echo "::error::Production-Schema liegt zurueck oder Health nicht lesbar."; exit 1; }

      # Pull Request -> Preview-Umgebung.
      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env preview
