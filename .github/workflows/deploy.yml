name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Notausgang (kein Ersatz fuer den push-Trigger): beim PR-7-Merge hat
  # GitHub fuer den Squash-Commit kein PushEvent erzeugt (Events-API leer,
  # kein Token-/paths-Problem — Einzelfall-Drop). Damit laesst sich der
  # Production-Deploy ohne leeren Trigger-Commit nachholen.
  workflow_dispatch:

# Pro Ziel-Ref nur ein Deploy gleichzeitig; laufende überholte Deploys abbrechen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # E21 (22.09.2026): Vorab-Check statt Auto-Migration — dieser Workflow
  # migriert Production NIE selbst. Migrationen laufen ausschliesslich ueber
  # den manuell ausgeloesten Workflow migrate-production.yml (Leitplanke
  # "Produktions-DB nur mit ausdruecklicher Freigabe"). Das Gate verhindert
  # das Vergessen: Es liest mit DATABASE_URL_PRODUCTION (read-only Query auf
  # drizzle.__drizzle_migrations) den angewendeten Stand und vergleicht ihn
  # mit dem Journal im Checkout. Liegt die DB zurueck, SCHLAEGT das Gate FEHL
  # ("Migration 00XX ausstehend — zuerst Migrate Production ausfuehren") und
  # der deploy-Job laeuft nicht: Es wird kein Code deployt, dessen Schema
  # fehlt — der alte Worker laeuft mit dem alten Schema weiter, das ist der
  # funktionierende Zustand (exakt umgekehrt zum Vorfall vom 22.09.).
  # Dieses Gate ist die TRAGENDE Pruefung; der Health-Check nach dem Rollout
  # ist nur zusaetzliche Bestaetigung.
  schema-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Environment nur wegen des Secrets DATABASE_URL_PRODUCTION; das Gate
    # liest ausschliesslich.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Schema-Stand pruefen (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db schema-gate

  deploy:
    needs: [schema-gate]
    # PRs laufen immer; main-Pushes nur, wenn das schema-gate gruen ist.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' ||
       needs.schema-gate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nur Preview: Schema-Migrationen automatisch gegen den Preview-Neon-Branch
      # anwenden, damit PRs mit Schemaaenderungen nicht mehr manuell nachgezogen
      # werden muessen. Production migriert dieser Workflow NIE — nur der
      # manuell ausgeloeste Workflow migrate-production.yml (E21). Der direkte
      # Neon-Connection-String kommt aus dem Repo-Secret, nie aus dem Repo.
      - name: Migrate Preview-DB
        if: github.event_name == 'pull_request'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm exec drizzle-kit migrate

      - name: Build (OpenNext)
        working-directory: apps/web
        env:
          # Echter Commit-SHA statt "dev" in /api/health. Bei PRs der Head-Commit,
          # sonst der gepushte Commit.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec opennextjs-cloudflare build

      # Push auf main -> Production (Top-Level-Umgebung).
      - name: Deploy Production
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env=""

      # E21: Nach dem Rollout /api/health befragen — meldet die Antwort
      # "schema: behind", SCHLAEGT der Deploy FEHL. Diese Abfrage ist NUR
      # zusaetzliche Bestaetigung: die tragende Pruefung ist das schema-gate
      # oben, das direkt mit der DB spricht. Ohne Access-Service-Token
      # (Secrets CF_ACCESS_CLIENT_ID/-SECRET; Access faengt curl sonst mit
      # 302 ab) wird der Check uebersprungen — ohne Luecke.
      - name: Health-Check Production (Schema)
        if: github.event_name != 'pull_request'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::warning::Health-Check uebersprungen: CF_ACCESS_CLIENT_ID/-SECRET (Access-Service-Token) fehlen als Secrets."
            exit 0
          fi
          antwort=$(curl -sS --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://bhyo-markt.bhyo.workers.dev/api/health)
          echo "$antwort"
          echo "$antwort" | grep -q '"schema":"ok"' || { echo "::error::Production-Schema liegt zurueck oder Health nicht lesbar."; exit 1; }

      # Pull Request -> Preview-Umgebung.
      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env preview
