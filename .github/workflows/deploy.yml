name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Notausgang (kein Ersatz fuer den push-Trigger): beim PR-7-Merge hat
  # GitHub fuer den Squash-Commit kein PushEvent erzeugt (Events-API leer,
  # kein Token-/paths-Problem — Einzelfall-Drop). Damit laesst sich der
  # Production-Deploy ohne leeren Trigger-Commit nachholen.
  workflow_dispatch:
    inputs:
      # Break-Glass fuer das schema-gate (E21): Ein fehlerhaftes Gate wuerde
      # sonst auch den Deploy seiner eigenen Reparatur blockieren —
      # geschlossene Schleife. Greift NUR auf dem dispatch-Pfad, nie bei
      # einem Push; bewusst unbequem (woertliche Eingabe).
      gate_umgehen:
        description: 'NOTAUSGANG: schema-gate umgehen — nur bei kaputtem Gate, woertlich "ja" eintippen'
        required: false
        default: ""

# Pro Ziel-Ref nur ein Deploy gleichzeitig; laufende überholte Deploys abbrechen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Review Eric (24.09.2026): Das Deploy-Ziel hing allein am EVENT —
  # `pull_request` deployt auf die Preview, JEDES andere Event nach
  # Production. Ein workflow_dispatch auf einem Feature- oder tmp-Branch
  # haette dessen ungeprueften Code nach Production geschoben; der Notausgang
  # war nie auf main beschraenkt. Diese Wache macht den Ref zur zweiten
  # Bedingung: Production ausschliesslich von refs/heads/main, Preview
  # weiterhin von jedem Branch. Sie laeuft VOR Gate und Deploy, beide haengen
  # per `needs` daran — ein falscher Ref bricht den Lauf ab, statt ihn still
  # zu ueberspringen.
  ziel-wache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Deploy-Ziel gegen den Ref pruefen
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "ZIELWACHE event=$EVENT ref=$REF -> Preview (jeder Branch zulaessig)"
            exit 0
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=PRODUCTION NUR VON MAIN::Dieser Lauf (event=$EVENT, ref=$REF) wuerde nach Production deployen, laeuft aber nicht auf refs/heads/main. Abgebrochen. Fuer einen Preview-Deploy eines Branches einen Pull Request oeffnen; ein workflow_dispatch gehoert ausschliesslich auf main."
            exit 1
          fi
          echo "ZIELWACHE event=$EVENT ref=$REF -> Production (zulaessig)"

  # E21 (22.09.2026): Vorab-Check statt Auto-Migration — dieser Workflow
  # migriert Production NIE selbst. Migrationen laufen ausschliesslich ueber
  # den manuell ausgeloesten Workflow migrate-production.yml (Leitplanke
  # "Produktions-DB nur mit ausdruecklicher Freigabe"). Das Gate verhindert
  # das Vergessen: Es liest mit DATABASE_URL_PRODUCTION (read-only Query auf
  # drizzle.__drizzle_migrations) den angewendeten Stand und vergleicht ihn
  # mit dem Journal im Checkout. Liegt die DB zurueck, SCHLAEGT das Gate FEHL
  # ("Migration 00XX ausstehend — zuerst Migrate Production ausfuehren") und
  # der deploy-Job laeuft nicht: Es wird kein Code deployt, dessen Schema
  # fehlt — der alte Worker laeuft mit dem alten Schema weiter, das ist der
  # funktionierende Zustand (exakt umgekehrt zum Vorfall vom 22.09.).
  # Dieses Gate ist die TRAGENDE Pruefung; der Health-Check nach dem Rollout
  # ist nur zusaetzliche Bestaetigung.
  # Typen und Tests laufen VOR allem anderen; Gate und Deploy haengen per
  # `needs` daran. Branch Protection (erforderliche Checks) ist im Free-Plan
  # fuer private Repos nicht verfuegbar — diese Abhaengigkeit ist deshalb der
  # einzige technische Guard: Sind Typen oder Tests rot, erreicht der Stand
  # WEDER Preview NOCH Production. Bewusst eng: nur Typen und Tests, kein
  # Lint, keine Formatierung, keine Coverage.
  typen-und-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Getrennte Schritte, damit im Log sofort sichtbar ist, was bricht.
      - name: Typen — apps/web
        run: pnpm --filter web exec tsc --noEmit
      - name: Typen — packages/db
        run: pnpm --filter @bhyo/db exec tsc --noEmit
      - name: Tests — apps/web
        run: pnpm --filter web test -- --run
      - name: Tests — packages/db
        run: pnpm --filter @bhyo/db test
      # F8/E30, E42: rechte-check — meldet jede Server-Action und jede
      # schreibende Route, die die Wache nicht mit einer Aktion der Matrix
      # aufruft. Laeuft zusaetzlich als Vitest-Fall; hier eigens, damit die
      # Luecke im Log als eigene Zeile mit Dateibezug erscheint.
      - name: rechte-check (Schreibpfade)
        working-directory: apps/web
        run: pnpm exec tsx scripts/rechte-check.ts

      # AP2.2 PR a: eine Schreibstelle fuer das Ereignisprotokoll, jeder
      # Schreibpfad protokolliert mit einer Art (scripts/protokoll-check.ts).
      - name: protokoll-check (Ereignisprotokoll)
        working-directory: apps/web
        run: pnpm exec tsx scripts/protokoll-check.ts

      # AP2.4 PR a (E62, D6): jede Spalte der vier Tabellen ist genau einmal
      # eingestuft (fachlich / redaktionell / technisch) — eine neue Spalte
      # ohne Einstufung ist rot (scripts/feld-check.ts).
      - name: feld-check (Feldeinstufung)
        working-directory: apps/web
        run: pnpm exec tsx scripts/feld-check.ts

      # AP2.2 PR b: inbox_eintrag wird nur in lib/inbox geschrieben.
      - name: inbox-check (Inbox-Schreibstelle)
        working-directory: apps/web
        run: pnpm exec tsx scripts/inbox-check.ts

      # Enum-Rename-Waechter: inbox_typ_text ist IMMUTABLE — Werte von
      # inbox_typ (und der Typ selbst) werden nie umbenannt, sonst waeren
      # Index-Praedikat und ON CONFLICT still falsch. Liste im Skript.
      - name: enum-rename-check (IMMUTABLE-Enums)
        run: pnpm --filter @bhyo/db enum-rename-check

  schema-gate:
    needs: [typen-und-tests, ziel-wache]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Environment nur wegen des Secrets DATABASE_URL_PRODUCTION; das Gate
    # liest ausschliesslich.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Der Notausgang greift nur hier: Bei einem Push existiert der Input
      # nicht (leer), das Gate laeuft also IMMER. Nur ein manueller
      # workflow_dispatch mit woertlich "ja" ueberspringt die Pruefung.
      - name: Schema-Stand pruefen (read-only)
        if: inputs.gate_umgehen != 'ja'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm --filter @bhyo/db schema-gate
      - name: "NOTAUSGANG aktiv: Gate uebersprungen"
        if: inputs.gate_umgehen == 'ja'
        run: |
          echo "::warning title=SCHEMA-GATE UEBERSPRUNGEN::Break-Glass gate_umgehen=ja — der Deploy laeuft OHNE Schema-Pruefung. Nur zulaessig, wenn das Gate selbst defekt ist. Schema-Stand danach von Hand pruefen (pnpm --filter @bhyo/db schema-stand) und den Gate-Defekt sofort beheben."
          echo "=============================================================="
          echo "  NOTAUSGANG: schema-gate wurde bewusst umgangen (gate_umgehen=ja)"
          echo "=============================================================="

  deploy:
    needs: [typen-und-tests, ziel-wache, schema-gate]
    # Typen/Tests sind IMMER Vorbedingung (auch bei PRs — sonst deployt ein
    # roter Stand auf die Preview). Zusaetzlich bei main-Pushes: nur wenn das
    # schema-gate gruen ist.
    if: >-
      always() && !cancelled() &&
      needs.typen-und-tests.result == 'success' &&
      needs.ziel-wache.result == 'success' &&
      (github.event_name == 'pull_request' ||
       needs.schema-gate.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Hyperdrive-Waechter (29.09.2026): Der Abfrage-Cache von Hyperdrive
      # liefert veraltete SELECT-Ergebnisse — ein frisch angelegter Eintrag
      # fehlt in der sofort gelesenen Liste, und die Vorpruefung auf
      # Eindeutigkeit laeuft ins Leere (Unique-Verletzung, 500). Der Cache
      # muss in BEIDEN Umgebungen aus sein. Hier wird die Konfiguration der
      # Zielumgebung gelesen, BEVOR irgendetwas deployt wird; gleicher Token
      # wie der Deploy, kein neues Secret. Kein Ergebnis ist kein Ergebnis:
      # Nicht lesbar = rot.
      - name: Hyperdrive-Waechter (Abfrage-Cache aus)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID: ${{ github.event_name == 'pull_request' && '7bf0712cc8224c32a061ef0abea561f9' || '2a873aa18f654dc4897b145cb24db7d7' }}
        run: |
          # Die geprüfte ID muss die sein, die wrangler.jsonc auch bindet.
          grep -q "\"id\": \"$HYPERDRIVE_ID\"" apps/web/wrangler.jsonc \
            || { echo "::error::Hyperdrive-ID $HYPERDRIVE_ID steht nicht in apps/web/wrangler.jsonc — Waechter und Bindung sind auseinandergelaufen."; exit 1; }
          antwort=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$HYPERDRIVE_ID")
          echo "$antwort" | jq -c '{success, errors, name: .result.name, caching: .result.caching}'
          echo "$antwort" | jq -e '.success == true' >/dev/null \
            || { echo "::error::Hyperdrive-Konfiguration $HYPERDRIVE_ID nicht lesbar (Token-Recht Hyperdrive:Read?)."; exit 1; }
          echo "$antwort" | jq -e '.result.caching.disabled == true' >/dev/null \
            || { echo "::error::Hyperdrive-Abfrage-Cache ist in der Zielumgebung AN (caching.disabled != true). Deploy abgebrochen."; exit 1; }

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nur Preview: Schema-Migrationen automatisch gegen den Preview-Neon-Branch
      # anwenden, damit PRs mit Schemaaenderungen nicht mehr manuell nachgezogen
      # werden muessen. Production migriert dieser Workflow NIE — nur der
      # manuell ausgeloeste Workflow migrate-production.yml (E21). Der direkte
      # Neon-Connection-String kommt aus dem Repo-Secret, nie aus dem Repo.
      # F0b PR D: Archiv-Waechter — sichert die befuellten E7-Altfelder als
      # Workflow-Artefakt, BEVOR 0017 sie droppt (auf der Preview sind das
      # die "Test:"-Zeilen; gewollt und als Artefakt nachvollziehbar).
      # Defensiv: nach dem DROP entfaellt er mit Hinweis.
      - name: Altfelder archivieren (Waechter 0017)
        if: github.event_name == 'pull_request'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: |
          pnpm run archiv-altfelder
          test -f altfelder-archiv.json || { echo '::error::Archivdatei fehlt — kein DROP.'; exit 1; }

      - name: Altfelder-Archiv hochladen
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: altfelder-archiv-preview
          path: packages/db/altfelder-archiv.json

      # E33 Schritt 3: Vorpruefung VOR der Migration — ein Beleg der oberen
      # vier Typen ohne gueltig_bis bricht hier mit Belegnummern ab, statt
      # 0022 in einen Constraint-Fehler laufen zu lassen (die Migration
      # schreibt keinen Fachwert). Nach 0022 weist derselbe Schritt nach,
      # dass der CHECK greift.
      - name: Fristen-Vorpruefung (gueltig_bis, E33)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-frist-check

      - name: Migrate Preview-DB
        if: github.event_name == 'pull_request'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm exec drizzle-kit migrate

      # E23: Paritaet der Qualitaets-Ableitung — DB-Funktion qualitaetsstufe()
      # gegen deriveQualitaet ueber alle Ankerfaelle, gegen die echte
      # Preview-DB (kein Mock). Abweichung bricht den Deploy ab.
      - name: Qualitaets-Paritaet (DB vs. TS)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web exec tsx scripts/qualitaet-paritaet.ts

      # F0b: dauerhafte DB-Checks der raeumlichen Verwaltungszuordnung —
      # Grenzpunkt (ST_Covers + DISTINCT ON), Rheingrenze RP/BW,
      # Eindeutigkeit der View. Gegen die echte Preview-DB.
      - name: Verwaltungs-Check (strom_verwaltung)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db verwaltung-check

      # E28/E29: Belegnummer — Vollstaendigkeit, Format, und der
      # Unveraenderlichkeits-Trigger in beide Richtungen (gleicher Wert geht
      # durch, echte Aenderung scheitert). Gegen die echte Preview-DB.
      - name: Belegnummer-Check (beleg_nr)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-nr-check

      # F8/E30: Benutzertabelle — mindestens ein aktiver Admin (fail closed
      # ohne Admin heisst: zugesperrt), Kleinschreibung der E-Mails, und der
      # CHECK muss wirklich greifen. Gegen die echte Preview-DB.
      - name: Benutzer-Check (benutzer)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db benutzer-check

      # E44 (AP2.1 PR b): Rolle pruefer im Enum, Sperrspalten mit CHECK
      # "beide NULL oder beide gesetzt" (muss greifen), strom_zuweisung mit
      # CHECK "genau ein Strom" (muss greifen) und partiellen Unique-Indizes.
      - name: Sperre-Check (Sperren, Zuweisungen)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db sperre-check

      # AP2.2 PR a: Ereignisprotokoll — Enum/Spalten/CHECK stehen, der CHECK
      # greift (Zeile ohne Urheber abgewiesen), Rollback hinterlaesst nichts.
      - name: Protokoll-Check (Ereignisprotokoll)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db protokoll-check

      # AP2.2 PR b: Inbox — Strukturen stehen, Unique-Index und CHECK greifen,
      # Buendelung per Upsert (anzahl + 1, ungelesen; nach erledigt neuer Eintrag).
      - name: Inbox-Check (Inbox)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db inbox-check

      # AP2.3 PR a (E60): Parameter mit Verlauf — Funktion, CHECK und Trigger
      # greifen (nie rueckwirkend, unveraenderlich, Ruecknahme nur kuenftig),
      # Wirksamkeit ab Datum, kein Standardwert.
      - name: Parameter-Check (Parameter mit Verlauf)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db parameter-check

      # Sektorliste (F5 PR B; seit AP2.3 PR b strukturell, E59): Spalten id/aktiv,
      # eindeutiger Index auf lower(btrim(label)) und der Code-CHECK greifen
      # ("abnehmer"/"ohne_sektor" nie ein Sektor), kein Akteur traegt einen
      # unbekannten Sektor, der Fremdschluessel greift, Akteur-Anlage mit/ohne
      # Sektor geht durch, ein Akteur an einem deaktivierten Sektor bleibt gueltig.
      - name: Sektor-Check (sektor)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db sektor-check

      # AP2.4 PR a (E62): Verifikationsmodell — strom_verifikation() steht und
      # leitet jeden Zustand richtig ab (ungeprueft, in_pruefung, gueltig,
      # abgelaufen, als_abgelaufen_markiert, pruefdatum_unbekannt), die
      # Typ-Frist zaehlt ab dem Prueftag, gueltig_bis gilt fuer die oberen
      # vier Typen, die Markierung wertet die Qualitaet ab (D3).
      - name: Verifikation-Check (strom_verifikation)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db verifikation-check

      # AP2.4 PR b (E63): Probe des Verifikations-Jobs gegen die Preview —
      # Idempotenz (zweiter Lauf erzeugt nichts), Nachholen am spaeteren
      # Stichtag, Empfaenger-Fallback, D3/ohne Beleg ohne Hinweis. Eine
      # zurueckgerollte Transaktion, nichts bleibt liegen.
      - name: Job-Probe (Verifikations-Hinweise)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter web exec tsx scripts/job-probe.ts

      # tmp Rot-Nachweis (nicht mergen): Job-Wache gegen die Preview mit einem
      # Stichtag ohne Lauf — muss rot werden.
      - name: tmp Job-Wache Rot-Nachweis (Preview, Stichtag 2000-01-01)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          JOB_WACHE_STUNDE: immer
        run: pnpm --filter @bhyo/db job-wache 2000-01-01

      # E34: Beleg-Zusicherungen — sieben Enum-Werte, der Quellenangabe-CHECK
      # greift, und JEDER Schreibpfad auf beleg (Formular-Insert/-Update,
      # Seed-Insert) geht fuer alle Typen durch, mit der Stufe der Matrix.
      # Zurueckgerollt, nichts bleibt liegen.
      - name: Beleg-Check (beleg)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-check

      # E34: Zielnachweis auf der Preview nach der Migration — WECHSEL muss
      # 0 sein (gespeicherte Stufe folgt der Matrix); GUELTIG_BIS_FEHLT zeigt
      # den Rueckstand fuer Schritt 3. Nur lesen, informativ.
      - name: Abweichungsliste Belege (Preview, nur lesen)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm --filter @bhyo/db beleg-abweichung

      - name: Build (OpenNext)
        working-directory: apps/web
        env:
          # Echter Commit-SHA statt "dev" in /api/health. Bei PRs der Head-Commit,
          # sonst der gepushte Commit.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec opennextjs-cloudflare build

      # Push auf main -> Production (Top-Level-Umgebung).
      - name: Deploy Production
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env=""

      # E21: Nach dem Rollout /api/health befragen — meldet die Antwort
      # "schema: behind", SCHLAEGT der Deploy FEHL. Diese Abfrage ist NUR
      # zusaetzliche Bestaetigung: die tragende Pruefung ist das schema-gate
      # oben, das direkt mit der DB spricht. Ohne Access-Service-Token
      # (Secrets CF_ACCESS_CLIENT_ID/-SECRET; Access faengt curl sonst mit
      # 302 ab) wird der Check uebersprungen — ohne Luecke.
      - name: Health-Check Production (Schema)
        if: github.event_name != 'pull_request'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::warning::Health-Check uebersprungen: CF_ACCESS_CLIENT_ID/-SECRET (Access-Service-Token) fehlen als Secrets."
            exit 0
          fi
          antwort=$(curl -sS --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://bhyo-markt.bhyo.workers.dev/api/health)
          echo "$antwort"
          echo "$antwort" | grep -q '"schema":"ok"' || { echo "::error::Production-Schema liegt zurueck oder Health nicht lesbar."; exit 1; }

      # Pull Request -> Preview-Umgebung.
      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env preview

  # Haertung (Entscheidung Eric, 29.09.2026, Punkt 3): Nach jedem main-Deploy
  # laeuft der Leseweg automatisch als letzter Schritt — nur lesend, ueber die
  # Leserolle bhyo_leser (Environment production-lesend, kein Schreibrecht).
  # Ein Fehlschlag macht den Lauf rot: Damit greifen die datenpruefenden
  # Checks (Zielnachweis, Abweichungsliste, Protokoll- und Inbox-Messung)
  # auch gegen Production, nicht nur gegen die Preview.
  lese-diagnose:
    needs: [deploy]
    if: github.event_name != 'pull_request' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    environment: production-lesend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Zielnachweis + Schreibversuch (muss scheitern)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db lese-diagnose
      - name: Abweichungsliste Belege (E34, nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
        run: pnpm --filter @bhyo/db beleg-abweichung
      - name: Protokoll- und Inbox-Messung (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION_LESEND }}
