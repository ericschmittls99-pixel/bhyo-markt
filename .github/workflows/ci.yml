name: CI

# Typen und Tests bei JEDEM Pull Request und auf main. Bis zu diesem
# Workflow (23.09.2026) lief im CI weder vitest noch ein expliziter
# Typecheck — die Tests liefen ausschliesslich lokal. Der OpenNext-Build in
# deploy.yml deckt nur den App-Code ab und erst nach der Preview-Migration.
# Bewusst eng gehalten: NUR Typen und Tests, kein Lint, keine Formatierung,
# keine Coverage.
on:
  pull_request:
  push:
    branches: [main]

# Ein laufender Check je Branch reicht; neuere Pushes loesen den alten ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typen-und-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Typen ueber alle Pakete. Getrennte Schritte, damit im Log sofort
      # sichtbar ist, welches Paket bricht.
      - name: Typen — apps/web
        run: pnpm --filter web exec tsc --noEmit
      - name: Typen — packages/db
        run: pnpm --filter @bhyo/db exec tsc --noEmit

      # Beide Suites. Kein --bail: ein Lauf soll ALLE Fehler zeigen.
      - name: Tests — apps/web
        run: pnpm --filter web test -- --run
      - name: Tests — packages/db
        run: pnpm --filter @bhyo/db test
