# TEMPORAER (E56 „Für mich", Messung): EXPLAIN der mengenbasierten Abfrage auf
# der Preview — braucht die Abfrage einen Index? Nur SELECT/EXPLAIN. Wird vor
# dem Merge geloescht.
name: tmp Für-mich EXPLAIN
on:
  push:
    branches: [e56-fuer-mich]
jobs:
  explain:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: EXPLAIN (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        working-directory: packages/db
        run: pnpm exec tsx src/tmp-fuer-mich-explain.ts
