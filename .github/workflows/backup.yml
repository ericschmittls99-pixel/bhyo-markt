name: Backup

on:
  schedule:
    # Taeglich 02:23 UTC — krumme Minute: GitHub startet volle Stunden stark
    # verzoegert (05.10.2026: 02:00-Cron lief um 08:45 UTC), wie bei der Job-Wache.
    - cron: "23 2 * * *"
  # Manuelles Ausloesen (zum Testen, ohne bis zum naechsten Cron zu warten).
  workflow_dispatch:

# Backups nie parallel/abbrechen — laufende Sicherung immer zu Ende bringen.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Bucket liegt in der Jurisdiction 'European Union' -> eigener .eu-Endpoint.
      R2_ENDPOINT: https://652b1c744dcd86d565a45ba46590f9b1.eu.r2.cloudflarestorage.com
      R2_BUCKET: bhyogenics-backups
      # R2 (S3-kompatibel) vertraegt die neuen aws-cli-v2-Default-Checksummen nicht
      # zuverlaessig — nur bei Bedarf berechnen, sonst schlaegt der Upload fehl.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # E73 (08.10.2026): Logs eines oeffentlichen Repos sind oeffentlich — Host und
      # Datenbanknutzer der Verbindungs-URL werden maskiert, bevor ein Skript sie nennt.
      # Per Muster, nicht per URL-Parser: das Leseweg-Secret hielt new URL() nicht stand (Lauf 37765054123).
      - name: DB-Host im Log maskieren (E73)
        env:
          URL_1: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: node -e 'for (const [k, v] of Object.entries(process.env)) { if (!k.startsWith("URL_") || !v) continue; const h = v.match(/@([^/?:\s]+)/); if (h) console.log("::add-mask::" + h[1]); const u = v.match(/\/\/([^:@\/]+)[:@]/); if (u) console.log("::add-mask::" + decodeURIComponent(u[1])); }'

      - name: PostgreSQL-18-Client installieren
        # Neon-Server laeuft auf Postgres 18; pg_dump muss >= Server-Version sein.
        # Nicht auf die Runner-Default-Version (16) verlassen — PGDG liefert 18.
        # Der versionierte bin-Pfad muss vor /usr/bin, sonst gewinnt das Default-16.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Tools verifizieren
        run: |
          set -euo pipefail
          pg_dump --version
          aws --version

      # E37-Nachtrag (28.09.2026): Dump UND Zaehlprotokoll aus demselben
      # Snapshot (repeatable read, pg_dump --snapshot) — der Restore-Test
      # vergleicht gegen das Protokoll, nicht gegen die laufende Production.
      - name: Dump mit Zaehlprotokoll erstellen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          FILE="bhyogenics-$(date -u +%Y-%m-%d).dump"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          echo "ZAEHL_FILE=${FILE%.dump}.zaehlung.json" >> "$GITHUB_ENV"
          pnpm --filter @bhyo/db backup-zaehlung "$PWD/$FILE"
          mv "packages/db/$FILE" . 2>/dev/null || true
          ls -lh "$FILE" "${FILE%.dump}.zaehlung.json"

      - name: Upload nach R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/$BACKUP_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$ZAEHL_FILE" "s3://$R2_BUCKET/$ZAEHL_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Hochgeladen nach s3://$R2_BUCKET/$BACKUP_FILE und $ZAEHL_FILE"
          echo "--- Bucket-Inhalt ---"
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT"
