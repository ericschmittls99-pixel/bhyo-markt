# TEMPORAER (AP2.3 PR b): Beweis, dass die Umstellung des Basisdatums auf den
# Kalendertag Europe/Berlin die Faelligkeit keines bestehenden Eintrags
# aendert — gegen die Preview. Nur SELECT. Wird vor dem Merge geloescht.
name: tmp Basisdatum-Paritaet
on:
  push:
    branches: [ap23-sektoren]
    paths: [".github/workflows/tmp-basisdatum-paritaet.yml", "packages/db/src/tmp-basisdatum-paritaet.ts"]
jobs:
  paritaet:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Faelligkeit UTC-Tag vs Berlin-Tag (nur lesen)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        working-directory: packages/db
        run: pnpm exec tsx src/tmp-basisdatum-paritaet.ts
